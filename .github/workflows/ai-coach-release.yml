name: Build APK Release

on:
  push:
    branches:
      - main
    paths:
      - 'lib/**'
      - 'pubspec.yaml'
      - 'android/**'
      - '.github/workflows/ai-coach-release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: 17
          distribution: temurin

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          cache: true
          channel: stable
          flutter-version-file: pubspec.yaml

      - name: Install dependencies
        run: flutter pub get

      - name: Code generation
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Configure signing
        working-directory: android
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 --decode > app/release.jks
          else
            keytool -genkeypair -keystore app/release.jks -storetype JKS -alias coach -keyalg RSA -keysize 2048 -validity 10000 -storepass coachpass123 -keypass coachpass123 -dname "CN=AI Coach"
          fi
          printf 'storeFile=release.jks\nkeyAlias=coach\nstorePassword=coachpass123\nkeyPassword=coachpass123\n' > key.properties

      - name: Build release APK
        run: flutter build apk --release --target-platform android-arm64

      - name: Rename APK
        run: mv build/app/outputs/flutter-apk/app-release.apk lichess-ai-coach.apk

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64
        with:
          tag_name: build-${{ github.run_number }}
          name: AI Coach build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: false
          files: lichess-ai-coach.apk
